<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Maintenance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 26px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; color: #0f172a; }
    p { font-size: 0.95rem; line-height: 1.6; color: #64748b; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #fef3c7;
      color: #92400e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9881;</div>
    <h1>Under Scheduled Maintenance</h1>
    <p>
      The system is currently undergoing scheduled maintenance and upgrades. 
      Please check back shortly.
    </p>
    <div class="badge">Status: Upgrading Systems</div>
  </div>
</body>
</html>
