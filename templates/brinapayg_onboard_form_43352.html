<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BrinaBio PAYG Client Onboarding</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#F9DBEB;
    margin:40px;
}

.bold-input {
    font-weight: bold;
    text-transform: uppercase;
}
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

.header {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
}

.logo {
    flex: 0 0 220px;   /* fixed width for logo area */
}
    
.logo img {
    width: 220px;
    height: auto;
}

.title {
    flex: 1;
    text-align: center;
}
    
.title h1 {
    color: #02128C;
    font-size: 40px;
    margin: 0;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-row-75-25 {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 15px;
}

.contact-row {
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.contact-column {
    display: flex;
    flex-direction: column;
}

.contact-section {
    background: #FDEBF4;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 10px;
}
    
h2 {
    background:#E35CA3;
    color:white;
    padding:10px;
}

h3{
    color:#143358;
    margin-top:0;
    margin-bottom:15px;
    border-bottom:1px solid #cccccc;
    padding-bottom:5px;
}
    
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
textarea{
    min-height:80px;
    resize:vertical;
    line-height:1.2;
}
    
input, select, textarea{
    width:100%;
    padding:8px;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
    font-size:16px;
    color: #02128C;
}

button{
    margin-top:25px;
    background:#0078d4;
    color:white;
    padding:12px 20px;
    border:none;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
    <div class="logo">
        <img src="/static/images/BrinaBioPAYG.png" alt="Brina Bio PAYG">
    </div>
    <div class="title">
        <h1>Client On-Boarding Submission</h1>
    </div>
</div>

<form id="onboardForm">

<h2>Business Information</h2>

<label>Legal Business Name *</label>
<input name="x_company_name" class="bold-input" required>

<label>Trading Name</label>
<input name="x_trading_name">

<div class="form-row">

    <div class="form-group">
        <label for="ein_number">EIN *</label>
        <input
            type="text"
            id="ein_number"
            name="x_ein"
            required
            maxlength="10"
            pattern="[0-9]{2}-[0-9]{7}"
            placeholder="12-3456789"
            title="Format must be 12-3456789"
            oninput="formatEIN(this)"
            onblur="validateEIN(this)">
    </div>

    <div class="form-group">
        <label for="legal_form">Legal Form *</label>
            <select
                id="legal_form"
                name="x_legal_form"
                required>
            </select>
    </div>

    <div class="form-group">
        <label for="entity_formed">
            Date Entity Formed *
        </label>
        <input
            type="date"
            id="entity_formed"
            name="x_entity_formed"
            required>
    </div>

</div>

<div class="form-row-75-25">

    <div class="form-group">
        <label for="registered_address">
            Registered Address *
        </label>

        <textarea
            name="registered_address"
            rows="3"
            required></textarea>
    </div>

    <div class="form-group">
        <label for="registered_state">
            State Registered *
        </label>

        <select
            id="registered_state"
            name="registered_state"
            required>
        </select>
    </div>

</div>

<h2>Contact Information</h2>

<div class="contact-row">

    <div class="contact-column">
        <div class="contact-section">
            <h3>Primary Contact</h3>
        </div>
        
        <label>Contact Name *</label>
        <input name="primary_contact_name" required>

        <label>Title *</label>
        <input name="primary_contact_title" required>

        <label>Email *</label>
        <input
            type="email"
            name="primary_contact_email"
            required>

        <label>Phone *</label>
        <input
            type="tel"
            name="primary_contact_phone"
            required>

    </div>

    <div class="contact-column">

        <h3>Secondary Contact</h3>

        <label>Contact Name</label>
        <input name="secondary_contact_name">

        <label>Title</label>
        <input name="secondary_contact_title">

        <label>Email</label>
        <input
            type="email"
            name="secondary_contact_email">

        <label>Phone</label>
        <input
            type="tel"
            name="secondary_contact_phone">

    </div>
</div>

<h2>Operations</h2>

<label>Years in Operation</label>
<input type="number"
       name="years_in_operation">

<label>Number of Staff</label>
<input type="number"
       name="number_staff">

<label>Number of Clients</label>
<input type="number"
       name="number_clients">

<label>Average Client Visits Per Month</label>
<input type="number"
       name="avg_client_visits_month">

<h2>Financial Information</h2>

<label>Annual Turnover</label>
<input type="number"
       step="0.01"
       name="annual_turnover">

<label>Total Assets</label>
<input type="number"
       step="0.01"
       name="total_assets">

<label>Total Liabilities</label>
<input type="number"
       step="0.01"
       name="total_liabilities">

<label>Main Banking Relationship</label>
<input name="bank_name">

<button type="submit">

Submit Application

</button>

</form>

</div>

<script>

async function loadStates()
{
    const response =
        await fetch(
            "/static/reference/us_states.json"
        );

    const states =
        await response.json();

    const select =
        document.getElementById(
            "registered_state"
        );

    select.innerHTML =
        '<option value="">-- Select State --</option>';

    states.forEach(state =>
    {
        const option =
            document.createElement(
                "option"
            );

        option.value =
            state.code;

        option.textContent =
            state.name;

        select.appendChild(
            option
        );
    });
}

async function loadLegalForms()
{
    const response =
        await fetch(
            "/static/reference/legal_forms.json"
        );

    const forms =
        await response.json();

    const select =
        document.getElementById(
            "legal_form"
        );

    select.innerHTML =
        '<option value="">-- Select Legal Form --</option>';

    forms.forEach(form =>
    {
        const option =
            document.createElement("option");

        option.value =
            form.code;

        option.textContent =
            form.name;

        select.appendChild(option);
    });
}
loadStates();
loadLegalForms();
    
function validateEIN(field)
{
    const pattern = /^\d{2}-\d{7}$/;

    if (!pattern.test(field.value))
    {
        field.setCustomValidity(
            "Please enter a valid EIN in the format 12-3456789"
        );
    }
    else
    {
        field.setCustomValidity("");
    }
    field.reportValidity();
}

function formatEIN(field)
{
    let value = field.value.replace(/\D/g, '');

    if (value.length > 9)
    {
        value = value.substring(0, 9);
    }

    if (value.length > 2)
    {
        value =
            value.substring(0, 2) +
            "-" +
            value.substring(2);
    }

    field.value = value;
}
    
document
.getElementById("onboardForm")
.addEventListener("submit",
async function(e){

    e.preventDefault();

    const formData =
        new FormData(this);

    const payload =
        Object.fromEntries(
            formData.entries()
        );

    const response =
        await fetch(
            "/onboard",
            {
                method:"POST",
                headers:{
                   "Content-Type":
                   "application/json"
                },
                body:JSON.stringify(payload)
            }
        );

    if(response.ok){
        alert(
            "Application Submitted"
        );
        this.reset();
    }
    else{
        alert(
            "Submission Failed"
        );
    }

});

</script>

</body>
</html>
