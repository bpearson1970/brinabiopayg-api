<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BrinaBio PAYG Client Onboarding</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#F9DBEB;
    margin:40px;
}

.bold-input {
    font-weight: bold;
    text-transform: uppercase;
}
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

.header {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
}

.small-label {
    font-size: 90%;
}
    
.logo {
    flex: 0 0 220px;   /* fixed width for logo area */
}
    
.logo img {
    width: 220px;
    height: auto;
}

.title {
    flex: 1;
    text-align: center;
}
    
.title h1 {
    color: #02128C;
    font-size: 40px;
    margin: 0;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-row-75-25 {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 15px;
}

.contact-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.contact-column {
    display: flex;
    flex-direction: column;
}

.contact-section {
    background: #FDEBF4;
    padding: 8px 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.four_column-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 10px;
}

.four_column-row label {
    margin-top: 0;
}
    
.four_column-group {
    display: flex;
    flex-direction: column;
}

h2 {
    background:#E35CA3;
    color:white;
    padding:10px;
}

h3{
    color:#143358;
    margin-top:0;
    padding-bottom:5px;
}

.contact-section h3 {
    margin: 0;
    padding: 0;
}
    
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
textarea{
    min-height:80px;
    resize:vertical;
    line-height:1.2;
}
    
input, select, textarea{
    width:100%;
    padding:8px;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
    font-size:16px;
    color: #02128C;
}

button{
    margin-top:25px;
    background:#0078d4;
    color:white;
    padding:12px 20px;
    border:none;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
    <div class="logo">
        <img src="/static/images/BrinaBioPAYG.png" alt="Brina Bio PAYG">
    </div>
    <div class="title">
        <h1>Client On-Boarding Submission</h1>
    </div>
</div>

<form id="onboardForm">

<h2>Business Information</h2>

<label>Legal Business Name *</label>
<input name="x_company_name" class="bold-input" required>

<label>Trading Name</label>
<input name="x_trading_name">

<div class="form-row">

    <div class="form-group">
        <label for="ein_number">EIN *</label>
        <input
            type="text"
            id="ein_number"
            name="x_ein"
            required
            maxlength="10"
            pattern="[0-9]{2}-[0-9]{7}"
            placeholder="12-3456789"
            title="Format must be 12-3456789"
            oninput="formatEIN(this)"
            onblur="validateEIN(this)">
    </div>

    <div class="form-group">
        <label for="legal_form">Legal Form *</label>
            <select
                id="legal_form"
                name="x_legal_form"
                required>
            </select>
    </div>

    <div class="form-group">
        <label for="entity_formed">
            Date Entity Formed *
        </label>
        <input
            type="date"
            id="entity_formed"
            name="x_entity_formed"
            required>
    </div>

</div>

<div class="form-row-75-25">

    <div class="form-group">
        <label for="registered_address">
            Registered Address *
        </label>

        <textarea
            name="x_registered_address"
            rows="3"
            required></textarea>
    </div>

    <div class="form-group">
        <label for="registered_state">
            State Registered *
        </label>

        <select
            id="registered_state"
            name="registered_state"
            required>
        </select>
    </div>

</div>

<h2>Contact Information</h2>

<div class="contact-row">

    <div class="contact-column">
        <div class="contact-section">
            <h3>Primary Contact</h3>
        </div>
        
        <label>Full Name *</label>
        <input name="x_primary_contact_name" required>

        <label>Title *</label>
        <input name="x_primary_contact_title" required>

        <label>Email *</label>
        <input
            type="email"
            name="_primary_contact_email"
            required>

        <label>Phone *</label>
        <input
            type="tel"
            name="_primary_contact_phone"
            required>

    </div>

    <div class="contact-column">
        <div class="contact-section">
            <h3>Secondary Contact</h3>
        </div>
            
        <label>Full Name</label>
        <input name="x_secondary_contact_name">

        <label>Title</label>
        <input name="x_secondary_contact_title">

        <label>Email</label>
        <input
            type="email"
            name="x_secondary_contact_email">

        <label>Phone</label>
        <input
            type="tel"
            name="x_secondary_contact_phone">

    </div>
</div>

<h2>Operations</h2>

<div class="four_column-row">

    <div class="four_column-group">
        <label for="years_in_operation">
            Years in Operation
        </label>

        <select
            id="years_in_operation"
            name="x_years_in_operation"
            required>

            <option value="">-- Select --</option>
            <option value="<1">Less than 1 year</option>
            <option value="1-2">1 - 2 years</option>
            <option value="3-5">3 - 5 years</option>
            <option value="6-10">6 - 10 years</option>
            <option value=">10">More than 10 years</option>

        </select>
    </div>

    <div class="four_column-group">
        <label for="number_staff">
            Staff
        </label>

        <select
            id="number_staff"
            name="x_staff"
            required>

            <option value="">-- Select --</option>
            <option value="<5">Less than 5 staff</option>
            <option value="5-10">5 - 10 staff</option>
            <option value="11-25">11 - 25 staff</option>
            <option value="26-50">26 - 50 staff</option>
            <option value=">50">More than 50 staff</option>

        </select>
    </div>

    <div class="four_column-group">
        <label for="active_patients">
            Active Patients
        </label>

        <select
            id="active_patients"
            name="x_active_patients"
            required>

            <option value="">-- Select --</option>
            <option value="<20">Less than 20 patients</option>
            <option value="21-50">21 - 50 patients</option>
            <option value="51-200">51 - 200 patients</option>
            <option value="201-500">201 - 500 patients</option>
            <option value=">500">More than 500 patients</option>

        </select>
    </div>

    <div class="four_column-group">
        <label class="small-label" for="patient_interactions">
            Monthly Patient Interactions
        </label>

        <select
            id="patient_interactions"
            name="x_patient_interactions"
            required>

            <option value="">-- Select --</option>
            <option value="<50">Less than 50 interactions</option>
            <option value="51-100">51 - 100 interactions</option>
            <option value="101-250">101 - 250 interactions</option>
            <option value="251-500">251 - 500 interactions</option>
            <option value=">500">More than 500 interactions</option>

        </select>
    </div>

</div>

<h2>Financial Information</h2>

<div class="four_column-row">

    <div class="four_column-group">
        <label for="annual_turnover">
            Annual Turnover
        </label>
        <select
            id="x_annual_turnover"
            name="annual_turnover"
            required>
        </select>
    </div>

    <div class="four_column-group">
        <label for="total_assets">
            Total Assets
        </label>
        <select
            id="x_total_assets"
            name="total_assets"
            required>
        </select>
    </div>

    <div class="four_column-group">
        <label for="total_liabilities">
            Total Liabilities
        </label>
        <select
            id="x_total_liabilities"
            name="total_liabilities"
            required>
        </select>
    </div>

    <div class="four_column-group">
        <label for="net_assets">
            Net Assets
        </label>
        <select
            id="x_net_assets"
            name="net_assets"
            required>
        </select>
    </div>
    
</div>
    

<label>Main Banking Relationship</label>
<input name="bank_name">

<button type="submit">

Submit Application

</button>

</form>

</div>

<script>

async function loadStates()
{
    const response =
        await fetch(
            "/static/reference/us_states.json"
        );

    const states =
        await response.json();

    const select =
        document.getElementById(
            "registered_state"
        );

    select.innerHTML =
        '<option value="">-- Select State --</option>';

    states.forEach(state =>
    {
        const option =
            document.createElement(
                "option"
            );

        option.value =
            state.code;

        option.textContent =
            state.name;

        select.appendChild(
            option
        );
    });
}

async function loadFinancialRanges()
{
    const response =
        await fetch(
            "/static/reference/financial_ranges.json"
        );

    const ranges =
        await response.json();

    const dropdowns =
    [
        "annual_turnover",
        "total_assets",
        "total_liabilities",
        "net_assets"
    ];

    dropdowns.forEach(id =>
    {
        const select =
            document.getElementById(id);

        select.innerHTML =
            '<option value="">-- Select Range --</option>';

        ranges.forEach(range =>
        {
            const option =
                document.createElement("option");

            option.value =
                range.code;

            option.textContent =
                range.name;

            select.appendChild(option);
        });
    });
}
    
async function loadLegalForms()
{
    const response =
        await fetch(
            "/static/reference/legal_forms.json"
        );

    const forms =
        await response.json();

    const select =
        document.getElementById(
            "legal_form"
        );

    select.innerHTML =
        '<option value="">-- Select Legal Form --</option>';

    forms.forEach(form =>
    {
        const option =
            document.createElement("option");

        option.value =
            form.code;

        option.textContent =
            form.name;

        select.appendChild(option);
    });
}
loadStates();
loadLegalForms();
loadFinancialRanges();
    
function validateEIN(field)
{
    const pattern = /^\d{2}-\d{7}$/;

    if (!pattern.test(field.value))
    {
        field.setCustomValidity(
            "Please enter a valid EIN in the format 12-3456789"
        );
    }
    else
    {
        field.setCustomValidity("");
    }
    field.reportValidity();
}

function formatEIN(field)
{
    let value = field.value.replace(/\D/g, '');

    if (value.length > 9)
    {
        value = value.substring(0, 9);
    }

    if (value.length > 2)
    {
        value =
            value.substring(0, 2) +
            "-" +
            value.substring(2);
    }

    field.value = value;
}
    
document
.getElementById("onboardForm")
.addEventListener("submit",
async function(e){

    e.preventDefault();

    const formData =
        new FormData(this);

    const payload =
        Object.fromEntries(
            formData.entries()
        );

    const response =
        await fetch(
            "/onboard",
            {
                method:"POST",
                headers:{
                   "Content-Type":
                   "application/json"
                },
                body:JSON.stringify(payload)
            }
        );

    if(response.ok){
        alert(
            "Application Submitted"
        );
        this.reset();
    }
    else{
        alert(
            "Submission Failed"
        );
    }

});

</script>

</body>
</html>
