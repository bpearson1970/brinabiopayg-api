<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BrinaBio PAYG Client Onboarding</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#F9DBEB;
    margin:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

.header {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
}

.logo {
    flex: 0 0 220px;   /* fixed width for logo area */
}
    
.logo img {
    width: 220px;
    height: auto;
}

.title {
    flex: 1;
    text-align: center;
}
    
.title h1 {
    color: #143358;
    font-size: 40px;
    margin: 0;
}
    
h2 {
    background:#E35CA3;
    color:white;
    padding:10px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input, select, textarea{
    width:96.5%;
    padding:8px;
}

button{
    margin-top:25px;
    background:#0078d4;
    color:white;
    padding:12px 20px;
    border:none;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
    <div class="logo">
        <img src="/static/images/BrinaBioPAYG.png" alt="Brina Bio PAYG">
    </div>
    <div class="title">
        <h1>Client On-Boarding Submission</h1>
    </div>
</div>

<form id="onboardForm">

<h2>Business Information</h2>

<label>Legal Business Name *</label>
<input name="x_company_name" required>

<label>Trading Name</label>
<input name="x_trading_name">

<label for="ein_number">EIN *</label>
<input
    type="text"
    id="ein_number"
    name="x_ein"
    required
    maxlength="10"
    pattern="[0-9]{2}-[0-9]{7}"
    placeholder="12-3456789"
    title="Format must be 12-3456789">

<script>
function validateEIN(field)
{
    const pattern = /^\d{2}-\d{7}$/;

    if (!pattern.test(field.value))
    {
        alert("EIN must be in format 12-3456789");
        field.focus();
    }
}
</script>
    
<label>State Registered</label>
<input name="registered_state">

<label>Registered Address</label>
<textarea name="registered_address"></textarea>

<h2>Primary Contact</h2>

<label>Contact Name *</label>
<input name="primary_contact_name" required>

<label>Title</label>
<input name="primary_contact_title">

<label>Email *</label>
<input type="email"
       name="primary_contact_email"
       required>

<label>Phone</label>
<input name="primary_contact_phone">

<h2>Operations</h2>

<label>Years in Operation</label>
<input type="number"
       name="years_in_operation">

<label>Number of Staff</label>
<input type="number"
       name="number_staff">

<label>Number of Clients</label>
<input type="number"
       name="number_clients">

<label>Average Client Visits Per Month</label>
<input type="number"
       name="avg_client_visits_month">

<h2>Financial Information</h2>

<label>Annual Turnover</label>
<input type="number"
       step="0.01"
       name="annual_turnover">

<label>Total Assets</label>
<input type="number"
       step="0.01"
       name="total_assets">

<label>Total Liabilities</label>
<input type="number"
       step="0.01"
       name="total_liabilities">

<label>Main Banking Relationship</label>
<input name="bank_name">

<button type="submit">

Submit Application

</button>

</form>

</div>

<script>

document
.getElementById("onboardForm")
.addEventListener("submit",
async function(e){

    e.preventDefault();

    const formData =
        new FormData(this);

    const payload =
        Object.fromEntries(
            formData.entries()
        );

    const response =
        await fetch(
            "/onboard",
            {
                method:"POST",
                headers:{
                   "Content-Type":
                   "application/json"
                },
                body:JSON.stringify(payload)
            }
        );

    if(response.ok){
        alert(
            "Application Submitted"
        );
        this.reset();
    }
    else{
        alert(
            "Submission Failed"
        );
    }

});

</script>

</body>
</html>
