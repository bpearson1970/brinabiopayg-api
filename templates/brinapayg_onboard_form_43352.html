<script>

async function loadStates()
{
    const response =
        await fetch(
            "/static/reference/us_states.json"
        );

    const states =
        await response.json();

    const select =
        document.getElementById(
            "registered_state"
        );

    select.innerHTML =
        '<option value="">-- Select State --</option>';

    states.forEach(state =>
    {
        const option =
            document.createElement(
                "option"
            );

        option.value =
            state.code;

        option.textContent =
            state.name;

        select.appendChild(
            option
        );
    });
}

function validateEIN(field)
{
    const pattern = /^\d{2}-\d{7}$/;

    if (!pattern.test(field.value))
    {
        field.setCustomValidity(
            "Please enter a valid EIN in the format 12-3456789"
        );
    }
    else
    {
        field.setCustomValidity("");
    }
    field.reportValidity();
}

function formatEIN(field)
{
    let value = field.value.replace(/\D/g, '');

    if (value.length > 9)
    {
        value = value.substring(0, 9);
    }

    if (value.length > 2)
    {
        value =
            value.substring(0, 2) +
            "-" +
            value.substring(2);
    }

    field.value = value;
}
    
document
.getElementById("onboardForm")
.addEventListener("submit",
async function(e){

    e.preventDefault();

    const formData =
        new FormData(this);

    const payload =
        Object.fromEntries(
            formData.entries()
        );

    const response =
        await fetch(
            "/onboard",
            {
                method:"POST",
                headers:{
                   "Content-Type":
                   "application/json"
                },
                body:JSON.stringify(payload)
            }
        );

    if(response.ok){
        alert(
            "Application Submitted"
        );
        this.reset();
    }
    else{
        alert(
            "Submission Failed"
        );
    }

});
