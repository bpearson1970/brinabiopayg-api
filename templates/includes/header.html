<head>
<meta charset="utf-8">
<title>BrinaBio PAYG Client Onboarding</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#F9DBEB;
    margin:40px;
}

.bold-input {
    font-weight: bold;
    text-transform: uppercase;
}
    
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

.header {
    display: flex;
    align-items: center;
    position: sticky;
    top: 0;
    background: white;
    z-index: 1000;
    padding-top: 15px;
    padding-bottom: 30px;
}

.client-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 50px;
    margin-top: 8px;
}    
    
.company-name {
    color: #4B4B4B;
    font-size: 24px;
    font-weight: 750;
    margin-top: 5px;
}

.client-logo {
    height: 40px;
    width: auto;
}    

.declaration-section {
    background: #eef7ff;
    border: 1px solid #c7dff5;
    border-radius: 8px;
    padding: 20px;
}

.declaration-text {
    font-style: italic;
    line-height: 1.25;
}

.submitted-by-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 15px;
}

.submission-label {
    font-weight: bold;
    min-width: 110px;
}

.radio-label {
    display: inline-block;
    white-space: nowrap;
    margin-right: 25px;
    font-weight: normal;
}

.submitted-by-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-weight: normal;
}

.submitted-by-name {
    margin-top: 15px;
}

.submitted-name-row input {
    width: 350px;
}

.submission-label {
    font-size: 16px;
    font-weight: 700;
}

.submitted-name-row {
    margin-top: 15px;
}

.submitted-name-row input {
    margin-top: 8px;
}
    
.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 40px;
    padding-top: 15px;

    border-top: 1px solid #cccccc;

    font-size: 12px;
    color: #666666;
}

.footer-left {
    flex: 1;
    text-align: left;
}

.footer-center {
    flex: 1;
    text-align: center;
}

.footer-right {
    flex: 1;
    text-align: right;

    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
}

.footer-logo {
    height: 18px;
    width: auto;
}
    
.small-label {
    font-size: 90%;
}
    
.logo {
    flex: 0 0 220px;   /* fixed width for logo area */
}
    
.logo img {
    width: 220px;
    height: auto;
}

.title {
    flex: 1;
    text-align: center;
}
    
.title h1 {
    color: #02128C;
    font-size: 40px;
    margin: 0;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-row-75-25 {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 15px;
}

.contact-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.contact-column {
    display: flex;
    flex-direction: column;
}

.contact-section {
    background: #FDEBF4;
    padding: 8px 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.four_column-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 10px;
}

.four_column-row label {
    margin-top: 0;
}
    
.four_column-group {
    display: flex;
    flex-direction: column;
}

h2 {
    background:#E35CA3;
    color:white;
    padding:10px;
}

.submission-heading {
    background: #002060;
    color: white;
    padding: 10px;
    margin-top: 30px;
}
    
h3 {
    color:#143358;
    margin-top:0;
    padding-bottom:5px;
}

.contact-section h3 {
    margin: 0;
    padding: 0;
}
    
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
textarea{
    min-height:80px;
    resize:vertical;
    line-height:1.2;
}
    
input, select, textarea{
    width:100%;
    padding:8px;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
    font-size:16px;
    color: #02128C;
}

button{
    margin-top:25px;
    background:#0078d4;
    color:white;
    padding:12px 20px;
    border:none;
    cursor:pointer;
}

input:required:invalid,
select:required:invalid,
textarea:required:invalid {
    border: 2px solid red;
}

input:required:valid,
select:required:valid,
textarea:required:valid {
    border: 2px solid green;
}
    
</style>
    
</head>
