<head>
<meta charset="utf-8">
<title>BrinaBio PAYG Client Onboarding</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#F9DBEB;
    margin:40px;
}

.bold-input {
    font-weight: bold;
    text-transform: uppercase;
}
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

.header {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
}

.small-label {
    font-size: 90%;
}
    
.logo {
    flex: 0 0 220px;   /* fixed width for logo area */
}
    
.logo img {
    width: 220px;
    height: auto;
}

.title {
    flex: 1;
    text-align: center;
}
    
.title h1 {
    color: #02128C;
    font-size: 40px;
    margin: 0;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-row-75-25 {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 15px;
}

.contact-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.contact-column {
    display: flex;
    flex-direction: column;
}

.contact-section {
    background: #FDEBF4;
    padding: 8px 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.four_column-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 10px;
}

.four_column-row label {
    margin-top: 0;
}
    
.four_column-group {
    display: flex;
    flex-direction: column;
}

h2 {
    background:#E35CA3;
    color:white;
    padding:10px;
}

h3{
    color:#143358;
    margin-top:0;
    padding-bottom:5px;
}

.contact-section h3 {
    margin: 0;
    padding: 0;
}
    
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
textarea{
    min-height:80px;
    resize:vertical;
    line-height:1.2;
}
    
input, select, textarea{
    width:100%;
    padding:8px;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
    font-size:16px;
    color: #02128C;
}

button{
    margin-top:25px;
    background:#0078d4;
    color:white;
    padding:12px 20px;
    border:none;
    cursor:pointer;
}

</style>

</head>
