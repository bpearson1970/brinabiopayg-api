<h2 class="submission-heading">
    Submission
</h2>

<div class="declaration-section">

    <div class="declaration-text">

        I certify that the information provided in this application is true,
        complete and accurate to the best of my knowledge. I understand that
        Brina Medical (US) LLC may rely upon this information in assessing
        this application and conducting ongoing business activities.

    </div>

    <div class="submitted-by-row">

        <div class="submission-label"> Submitted by:</div>

        <label class="submitter-option">
            <input type="radio"
                   name="submitter_type"
                   value="Primary Contact"
                   onchange="updateSubmitter()"
                   required>
            Primary&nbsp;Contact
        </label>

        <label>
            <input type="radio"
                   name="submitter_type"
                   value="Secondary Contact"
                   onchange="updateSubmitter()">
            Secondary Contact
        </label>

        <label>
            <input type="radio"
                   name="submitter_type"
                   value="Other"
                   onchange="updateSubmitter()">
            Other
        </label>

    </div>

    <div class="submitted-name-row">

        <label class="submission-label" for="submitted_by_name" >
            Name of person submitting:
        </label>
    
        <input
            type="text"
            id="submitted_by_name"
            name="x_submitted_by_name"
            required>
    </div>
    
</div>

<button type="submit">

Submit

</button>
