<h2 class="submission-heading">
    Submission
</h2>

<div class="declaration-section">

    <div class="declaration-text">

        I certify that the information provided in this application is true,
        complete and accurate to the best of my knowledge. I understand that
        Brina Medical (US) LLC may rely upon this information in assessing
        this application and conducting ongoing business activities.

    </div>

    <div class="submitted-by-row">
    
        <div class="submission-label">
            Submitted by:
        </div>
    
        <label class="radio-label">
            <input
                type="radio"
                name="submitter_type"
                value="Primary Contact"
                onchange="updateSubmitter()"
                required>
    
            Primary Contact
        </label>
    
        <label class="radio-label">
            <input
                type="radio"
                name="submitter_type"
                value="Secondary Contact"
                onchange="updateSubmitter()">
    
            Secondary Contact
        </label>
    
        <label class="radio-label">
            <input
                id="submitter_type"
                type="radio"
                name="x_submitter_type"
                value="Other"
                onchange="updateSubmitter()">
    
            Other
        </label>
    
    </div>

    <div class="signature-row">

        <div class="submitter-block">
    
            <label class="submission-label"
                   for="submitted_by_name">
                Name of person submitting:
            </label>
    
            <input
                type="text"
                id="submitted_by_name"
                name="x_submitted_by_name"
                required
                oninput="updateSignature()">
    
        </div>

        <div class="signature-block">
    
            <div id="signature_preview"
                 class="signature-preview">
            </div>
    
        </div>

    </div>
    
</div>

<!-- Buttons -->

<div class="button-row">
    <div class="button-center">
        <button
            id="submitButton"
            type="button"
            class="submit-button"
            onclick="prepareSubmission()">
            Submit
        </button>
    </div>

    <div class="button-right">
        <button
            id="resetButton"
            type="button"
            class="reset-button"
            onclick="resetForm()">
            Reset
        </button>
    </div>
</div>

<!-- Hidden submission reference -->

<input type="hidden"
    id="submit_reference"
    name="x_submit_reference"
    value="0">

<input type="hidden"
    id="ip_address"
    name="x_ip_address"
    value="">

<input type="hidden"
    id="submitted_timestamp"
    name="x_submitted_timestamp"
    value="">

<input type="hidden"
    id="user_agent"
    name="x_user_agent"
    value="">

<input type="hidden"
    id="client_id"
    name="x_client_id"
    value="{{ client_id }}">

<input type="hidden"
    id="active"
    name="x_active"
    value="{{ active }}">
