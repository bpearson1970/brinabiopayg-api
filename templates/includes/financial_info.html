<h2>Financial Information</h2>

<div class="four_column-row">

    <div class="four_column-group">
        <label for="annual_turnover">
            Annual Turnover
        </label>
        <select
            id="annual_turnover"
            name="x_annual_turnover"
            required>
        </select>
    </div>

    <div class="four_column-group">
        <label for="total_assets">
            Total Assets
        </label>
        <select
            id="total_assets"
            name="x_total_assets"
            required>
        </select>
    </div>

    <div class="four_column-group">
        <label for="total_liabilities">
            Total Liabilities
        </label>
        <select
            id="total_liabilities"
            name="x_total_liabilities"
            required>
        </select>
    </div>

    <div class="four_column-group">
        <label for="net_assets">
            Net Assets
        </label>
        <select
            id="net_assets"
            name="x_net_assets"
            required>
        </select>
    </div>
    
</div>
    
<div class="four_column-row">

    <div class="four_column-group">
        <label for="bank_name">
            Main Banking Relationship
        </label>
        <input
            type="text"
            id="bank_name"
            name="bank_name"
            required>
    </div>
    
    <div class="four_column-group">
        <label for="bank_years">
            Relationship Years
        </label>
        <select
            id="bank_years"
            name="x_bank_years"
            required>
        </select>
    </div>

    <div class="four_column-group">
        <label for="approved_credit">
            Approved Credit Facilities
        </label>
        <select
            id="approved_credit"
            name="x_approved_credit"
            required>
        </select>
    </div>

    <div class="four_column-group">
        <label for="liability_insurance">
            General Liability Insurance
        </label>
        <select
            id="liability_insurance"
            name="x_liability_insurance"
            required>
        </select>
    </div>

</div>
