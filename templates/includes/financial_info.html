<h2>Financial Information</h2>

<div class="three_column-row">

    <div class="three_column-group">
        <label for="annual_turnover">
            Annual Turnover
        </label>
        <select
            id="annual_turnover"
            name="x_annual_turnover"
            required>
        </select>
    </div>

    <div class="three_column-group">
        <label for="total_assets">
            Total Assets
        </label>
        <select
            id="total_assets"
            name="x_total_assets"
            required>
        </select>
    </div>

    <div class="three_column-group">
        <label for="total_liabilities">
            Total Liabilities
        </label>
        <select
            id="total_liabilities"
            name="x_total_liabilities"
            required>
        </select>
    </div>
</div>

<div class="three_column-row">
    <div class="three_column-group">
        <label for="net_assets">
            Net Assets
        </label>
        <select
            id="net_assets"
            name="x_net_assets"
            required>
        </select>
    </div>
    
    <div class="three_column-group">
        <label for="cash_assets">
            Cash and Cash Equivalents
        </label>
        <select
            type="text"
            id="cash_assets"
            name="x_cash_assets"
            required>
        </select>
    </div>
    
    <div class="three_column-group">
        <label for="payable">
            Short term payables
        </label>
        <select
            id="payables"
            name="x_payables"
            required>
        </select>
    </div>
</div>
