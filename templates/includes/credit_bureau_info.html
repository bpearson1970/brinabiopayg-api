<h2>Credit Bureau</h2>

<div class="three_column-row">

    <div class="three_column-group" style="background-color: #FDEBF4; border-radius: 6px; padding: 15px 10px;">
        <div style="margin-bottom: 10px;">
            <label style="display: block; text-align: center; line-height: 1.5;">
                Are you registered with a Credit Bureau?
            </label>
        </div>
        <div style="display: flex; justify-content: center; align-items: center; gap: 20px; height: 36px;">
              <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal">
                  Yes
                  <input type="radio" name="is_cb_registered" value="yes" onchange="toggleBureauFields(this.value)"/>
              </label>
              <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal">
                  No
                  <input type="radio" name="is_cb_registered" value="no" checked="checked" onchange="toggleBureauFields(this.value)"/>
              </label>
        </div>
    </div>
    
    <div class="three_column-group" id="col_credit_bureau" style="display: none; background-color: #FDEBF4; border-radius: 6px; padding: 15px 10px;">
        <div style="margin-bottom: 5px;">
            <label for="credit_bureau" style="margin-bottom: 5px;">
                Name of Credit Bureau
            </label>
            <select
                id="credit_bureau"
                onchange="changeBureauSelect(this.value)"
            >
            </select>
        </div>
        <div id="cb_other" style="display: none; margin-top: 10px;">
            <input type="text" id="credit_bureau_other" name="y_credit_bureau_other" placeholder="Credit Bureau Name" oninput="updateOtherBureau(this.value)" />
        </div>        
        <div id="cb_name" style="display: none;">
            <input type="text" id="credit_bureau_name" name="x_credit_bureau_name" value="None" readonly="readonly" required />
        </div>
    </div>
    
    <div class="three_column-group" id="col_score" style="display: none; background-color: #FDEBF4; border-radius: 6px; padding: 15px 10px;">
        <div style="margin-bottom: 5px;">
            <label id="cb_score_label" style="display: block;" value=""/>
        </div>
        <div id="csList" style="display: none; margin-top: 5px;">
            <select
                id="credit_score"
                >
            </select>
        </div>
        <div id="other_score" style="display: none; margin-top: 5px;">
            <input type="text" id="other_score_input" placeholder="Enter score" oninput="updateOtherScore(this.value)" />
        </div>
        <div id="cs_score" style="display: none;">
            <input type="text" id="cs_score_value" name="x_cs_score_value" value="None" readonly="readonly" required/>
        </div>
    </div>

</div>
