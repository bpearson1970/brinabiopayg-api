<h2>Credit Bureau</h2>

<div class="three_column-row">

    <div class="three_column-group">
        <div>
            <label style="display: block; text-align: center; line-height: 1.5;">
                Are you registered with a Credit Bureau?
            </label>
        </div>
        <div style="display: flex; align-items: center; gap: 20px; height: 36px; text-align: center; font-weight: normal;">
              <label style="display: inline-flex; align-items: center; gap: 6px;">
                  Yes
                  <input type="radio" name="is_cb_registered" value="yes" onchange="toggleBureauFields(this.value)"/>
              </label>
              <label style="display: inline-flex; align-items: center; gap: 6px;">
                  No
                  <input type="radio" name="is_cb_registered" value="no" checked="checked" onchange="toggleBureauFields(this.value)"/>
                  Yes
              </label>
        </div>
    </div>
    
    <div class="three_column-group">
        <label for="bank_years">
            Relationship Years
        </label>
        <select
            id="bank_years"
            name="x_bank_years"
            required>
        </select>
    </div>

    <div class="three_column-group">
        <label for="approved_credit">
            Approved Credit Facilities
        </label>
        <select
            id="approved_credit"
            name="x_approved_credit"
            required>
        </select>
    </div>

</div>
