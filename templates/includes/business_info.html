<h2>Business Information</h2>

<label>Legal Business Name *</label>
<input id="company_name" name="x_company_name" class="bold-input" required>

<label>Trading Name</label>
<input name="x_trading_name">

<div class="form-row">

    <div class="form-group">
        <label for="ein_number">EIN *</label>
        <input
            type="text"
            id="ein_number"
            name="x_ein"
            required
            maxlength="10"
            pattern="[0-9]{2}-[0-9]{7}"
            placeholder="12-3456789"
            title="Format must be 12-3456789"
            oninput="formatEIN(this)"
            onblur="validateEIN(this)">
    </div>

    <div class="form-group">
        <label for="legal_form">Legal Form *</label>
            <select
                id="legal_form"
                name="x_legal_form"
                required>
            </select>
    </div>

    <div class="form-group">
        <label for="entity_formed">
            Date Entity Formed *
        </label>
        <input
            type="date"
            id="entity_formed"
            name="x_entity_formed"
            required>
    </div>

</div>

<div class="address-row">

    <div class="form-group">
        <label for="registered_address">
            Registered Address *
        </label>

        <textarea
            name="x_registered_address"
            rows="3"
            required></textarea>
    </div>
    
    <div style="grid-column: 2 / 4;">
        <div class="state-zip-row">
            <div class="form-group">
                <label for="state">
                    State *
                </label>
        
                <select
                    id="state"
                    name="x_state"
                    required>
                </select>
            </div>
            <div class="form-group">
                <label for="zip">
                    Zip *
                </label>
        
                <input
                    id="zip"
                    name="x_zip"
                   type="text"
                    inputmode="numeric"
                    maxlength="5"
                    pattern="[0-9]{5}"
                    placeholder="12345"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,5)"
                    onblur="validateZip(this)"
                    required>
                </input>
            </div>
        </div>

        <div class="form-group">
            <label for="city_town">
                City/Town *
            </label>
        </div>
    </div>
</div>
