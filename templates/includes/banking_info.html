<h2>Banking Information</h2>

<div class="three_column-row">

    <div class="three_column-group">
        <label for="bank_name">
            Main Banking Relationship
        </label>
        <input
            type="text"
            id="bank_name"
            name="x_bank_name"
            required>
    </div>
    
    <div class="three_column-group">
        <label for="bank_years">
            Relationship Years
        </label>
        <select
            id="bank_years"
            name="x_bank_years"
            required>
        </select>
    </div>

    <div class="three_column-group">
        <label for="approved_credit">
            Approved Credit Facilities
        </label>
        <select
            id="approved_credit"
            name="x_approved_credit"
            required>
        </select>
    </div>

</div>
