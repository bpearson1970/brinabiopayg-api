function toggleBureauFields(val) {
    const col2 = document.getElementById("col_credit_bureau");
    const col3 = document.getElementById("col_score");
    const cbSelect = document.getElementById("credit_bureau");
    const cbOtherText = document.getElementById("credit_bureau_other");
    const cbOther = document.getElementById("cb_other");
    const cbScoreLabel = document.getElementById("cb_score_label");
    const scoreSelect = document.getElementById("credit_score");
    const scoreOther = document.getElementById("other_score");

    cbSelect.value = "";
    col3.style.display = "none";
    
    if (val === "no") {
        col2.style.display = "none";
        
        cbSelect.required = false;
        document.getElementById("credit_bureau_name").value = "None";
        document.getElementById("cs_score_value").value = "None";
        cbOtherText.required = false;
        cbOtherText.value = "";
        cbOther.style.display = "none";
        scoreOther.required = false;
        cbSelect.required = false;
    }
    else {
        col2.style.display = "block";
        cbSelect.required = true;
        document.getElementById("credit_bureau_name").value = "None";
        document.getElementById("cs_score_value").value = "None";
        cbSelect.required = true;
    }
}

function changeBureauSelect(val) {
    document.getElementById("credit_bureau_name").value = val;

    const cbOther = document.getElementById("cb_other");
    const cbOtherText = document.getElementById("credit_bureau_other");
    const cbScoreLabel = document.getElementById("cb_score_label");
    const col3 = document.getElementById("col_score");
    const cbSelect = document.getElementById("credit_bureau");
    const selectedOption = cbSelect.options[cbSelect.selectedIndex];
    const scoreLabel = selectedOption.dataset.score || "Credit Score";
    const scoreSelect_Section = document.getElementById("csList");
    const scoreSelect = document.getElementById("credit_score");
    const scoreOther_Section = document.getElementById("other_score");
    const scoreOther = document.getElementById("other_score_input");
    
    cbScoreLabel.innerText = scoreLabel;
    document.getElementById("cs_score_value").value = "None";
    document.getElementById("other_score_input").value = "";
    col3.style.display = "block";
    
    if (val === "Other") {
        cbOtherText.value = "";
        cbOtherText.required = true;
        cbOther.style.display = "block";
        scoreSelect_Section.style.display = "none";
        scoreOther_Section.style.display = "block";
        scoreSelect.required = false;
        scoreOther.required = true;
    }
    else {
        scoreSelect.required = true;
        cbOtherText.required = false;
        cbOther.style.display = "none";
        scoreSelect_Section.style.display = "block";
        scoreOther_Section.style.display = "none";        
    }
}

function updateOtherBureau(val) {

async function loadStates()
{
    const response = await fetch("/static/reference/us_states.json");
    const states = await response.json();

    const dropdowns =
    [
        "state"
    ];

    dropdowns.forEach(id =>
    {
        const select = document.getElementById(id);

        if (!select) { return; }
        select.innerHTML = '<option value="">-- Select State --</option>';
        states.forEach(state =>
        {
            const option = document.createElement("option");
            option.value = state.code;
            option.textContent = state.name;
            select.appendChild(option)
        });
    });
}

function checkActive()
{
    const active = document.getElementById( "active" ).value;

    document.getElementById( "test-mode-banner" ).style.display =
        active === "100"
        ? "block"
        : "none";
    
    if ( ["1", "100"].includes(active) )
    {
        return;
    }
    
    if (active === "0")
    {
        alert(
            "This onboarding form is temporarily disabled.\n\n" +
            "Please refresh and try again later."
        );
        disableForm();
        return;
    }
    
    const overrideCode =
        prompt(
            "This onboarding form is currently disabled.\n\n" +
            "Please enter the administrator access code."
        );
    
    if (overrideCode !== active)
    {
        alert(
            "Invalid access code."
        );

        disableForm();
        return;
    }
}

function disableForm()
{
    document
        .querySelectorAll(
            'input:not([type="hidden"]), select, textarea'
        )
        .forEach(
            field => field.disabled = true
        );

    document
        .querySelector(
            '.submit-button'
        )
        .disabled = true;

    document
        .querySelector(
            '.submit-button'
        )
        .textContent =
        "Form Disabled";

    document.getElementById("resetButton").style.display = "none";
}
    
function updateSubmitter()
{
    const selected =
        document.querySelector('input[name="y_submitter_type"]:checked').value;
            
    const field =
        document.getElementById("submitted_by_name");

    const store =
        document.getElementById("submitter_type_value");

    const primary =
        document.getElementById("primary_contact_name").value;

    const secondary =
        document.getElementById("secondary_contact_name").value;
    
    if (selected === "Primary Contact")
    {
        field.value = primary;
        field.readOnly = true;
        store.value = selected;
    }
    else if (selected === "Secondary Contact")
    {
        if (secondary.trim() === "")
        {
            alert(
                "Please enter a Secondary Contact Name before selecting Secondary Contact as the submitter."
            );
            document.getElementById("submitter_other").checked = true;
            field.value = "";
            field.readOnly = false;
            store.value = "Other";

            updateSignature();
            return
        }
        else
        {
            field.value = secondary;
            field.readOnly = true;
            store.value = selected;
        }   
    }
    else
    {
        field.value = "";
        field.readOnly = false;
        store.value = "Other";
    }

    updateSignature();
}

function updateSignature()
{
    const name =
        document.getElementById(
            "submitted_by_name"
        ).value;

    document.getElementById(
        "signature_preview"
    ).textContent = name;
}    
    
function validateEIN(field)
{
    const pattern = /^\d{2}-\d{7}$/;

    if (!pattern.test(field.value))
    {
        field.setCustomValidity(
            "Please enter a valid EIN in the format 12-3456789"
        );
    }
    else
    {
        field.setCustomValidity("");
    }
    field.reportValidity();
}

function formatEIN(field)
{
    let value = field.value.replace(/\D/g, '');

    if (value.length > 9)
    {
        value = value.substring(0, 9);
    }

    if (value.length > 2)
    {
        value =
            value.substring(0, 2) +
            "-" +
            value.substring(2);
    }

    field.value = value;
}

function formatPhone(field)
{
    let value = field.value.replace(/\D/g, '');

    if (value.length > 10)
    {
        value = value.substring(0,10);
    }

    if (value.length > 6)
    {
        value =
            "(" +
            value.substring(0,3) +
            ") " +
            value.substring(3,6) +
            "-" +
            value.substring(6);
    }
    else if (value.length > 3)
    {
        value =
            "(" +
            value.substring(0,3) +
            ") " +
            value.substring(3);
    }

    field.value = value;
}

function validatePhone(field)
{
    // Allow blank values
    if (field.value.trim() === "")
    {
        field.setCustomValidity("");
        return;
    }
    
    const pattern =
        /^\(\d{3}\)\s\d{3}-\d{4}$/;

    if (!pattern.test(field.value))
    {
        field.setCustomValidity(
            "Please enter a phone number in the format (555) 123-4567"
        );
    }
    else
    {
        field.setCustomValidity("");
    }

    field.reportValidity();
}    

function validateEmail(field)
{
    field.value = field.value.trim();

    if (field.value === "")
    {
        field.setCustomValidity("");
        return;
    }
    const pattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!pattern.test(field.value))
    {
        field.setCustomValidity(
            "Please enter a valid email address"
        );
    }
    else
    {
        field.setCustomValidity("");
    }

    field.reportValidity();
}
    
function validateZip(field)
{
    const zip =
        field.value.trim();

    if (
        zip !== "" &&
        !/^\d{5}$/.test(zip)
    )
    {
        field.setCustomValidity(
            "ZIP Code must contain exactly 5 numeric digits."
        );
    }
    else
    {
        field.setCustomValidity("");
    }

    field.reportValidity();
}
    
function generateSubmitReference()
{
    const now = new Date();

    const timestamp =
        now.getFullYear().toString() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0") +
        String(now.getSeconds()).padStart(2, "0");

    const random =
        Math.floor(
            100000 + Math.random() * 900000
        );

    return `${timestamp}_${random}`;
}

function resetForm()
{
    if (
        confirm(
            "Are you sure you want to clear the entire form?"
        )
    )
    {
        document
            .querySelector("form")
            .reset();

        document
            .getElementById(
                "submit_reference"
            )
            .value = "0";

        document.getElementById("signature_preview").textContent = "";

        /* REVERT SUBMIT BUTTON CHARACTERISTICS */
        const submitButton = document.getElementById("submitButton");
        submitButton.textContent = "Submit";
        submitButton.style.background = "#0A67C8";
        submitButton.onclick = prepareSubmission;

        updateSubmitter();
    }
}

async function prepareSubmission()
{
    const form =
        document.querySelector("form");

    if (!form.checkValidity())
    {
        form.reportValidity();
        return;
    }

    const submitRefField = document.getElementById("submit_reference");

    if (submitRefField.value !== "0")
    {
        alert(
            "This application has already been submitted.\n\n" +
            "Please use Reset Form before creating a new application."
        );

        return;
    }
   
    const submitReference =
        generateSubmitReference();

    const proceed =
        confirm(
            "APPLICATION READY FOR SUBMISSION\n\n" +
            "Submission Reference:\n\n" +
            submitReference +
            "\n\n" +
            "Please note this reference number.\n\n" +
            "Press OK to submit.\n" +
            "Press Cancel to return to the form."
        );

    if (!proceed)
    {
        return;
    }

    submitRefField.value = submitReference;

    submitApplication();
}

async function submitApplication()
{
    // Create signature image
    const canvas = await html2canvas(
        document.getElementById('signature_preview'),
        {
            backgroundColor: null
        }
    );
    
    const signatureImage = canvas.toDataURL('image/png');

    const submittedTimestamp =
    new Date().toLocaleString(
        "en-GB",
        {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
            timeZoneName: "longOffset"
        }
    );   

    const submitTSField = document.getElementById("submitted_timestamp");
    submitTSField.value = submittedTimestamp;

    const activeField = document.getElementById("active");
    
    if (activeField.value !== "100")
    {
        const payload = {};
        document
            .querySelectorAll("[name^='x_']")
            .forEach(field =>
            {
                payload[field.name] = field.value;
            });
    
        payload.x_version = document.getElementById("version").textContent;
        payload.signature_image = signatureImage;

        const pdf_result = await generatePDFReceipt();
            payload.x_submission_receipt_pdf = pdf_result.pdf_base64;
            payload.x_submission_receipt_filename = pdf_result.filename;
        
        const response = await fetch(
            "/onboard",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            }
        );
    
        const result =
            await response.json();
        
            console.log("Status:", response.status);
            console.log(result);
            
            if (!response.ok)
            {  alert("Submission failed. Please try again." );
                return;
            }
    }

    printReceipt();
    
    /* CHANGE SUBMIT BUTTON CHARACTERISTICS */
    const submitButton = document.getElementById("submitButton");
    submitButton.textContent = "Print Receipt";
    submitButton.style.background = "#2E7D32";
    submitButton.onclick = printReceipt;
}

async function generatePDFReceipt()
{
    const submittedTimestamp = document.getElementById("submitted_timestamp").value;
    const submissionReference = document.getElementById("submit_reference").value;
    const companyName = document.getElementById("company_name").value;
    const submittedBy = document.getElementById("submitted_by_name").value + " (" +
        document.getElementById("submitter_type_value").value + ")";
    const version = document.getElementById("version").textContent;
    const activeValue = document.getElementById("active").value;
    
    const response = await fetch("/generate-receipt-pdf", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },        
        body: JSON.stringify({
            submission_reference: submissionReference,
            company_name: companyName,
            submitted_by: submittedBy,
            submitted_timestamp: submittedTimestamp,
            version: version,
            active_value: activeValue
        })
    });

    const result = await response.json();
    console.log(result);
    return result;
}
    
function printReceipt()
{
    const submittedTimestamp = document.getElementById("submitted_timestamp").value;
    const submissionReference = document.getElementById("submit_reference").value;
    const companyName = document.getElementById("company_name").value;
    const submittedBy = document.getElementById("submitted_by_name").value;
    const submitterType = document.getElementById("submitter_type_value").value;
    const version = document.getElementById("version").textContent;
    const activeValue = document.getElementById("active").value;
       
    const receiptUrl =
        "/receipt?" +
        "submission_reference=" + encodeURIComponent(submissionReference) +
        "&company_name=" + encodeURIComponent(companyName) +
        "&submitted_by=" + encodeURIComponent(submittedBy + " (" + submitterType + ")" ) +
        "&submitted_timestamp=" + encodeURIComponent(submittedTimestamp) +
        "&version=" +  encodeURIComponent(version) +
        "&active=" +  encodeURIComponent(activeValue);
    
    window.open(receiptUrl, "_blank");

}
    
document
    .getElementById("entity_formed")
    .max =
    new Date()
        .toISOString()
        .split("T")[0];
    
checkActive();
