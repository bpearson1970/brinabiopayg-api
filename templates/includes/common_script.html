async function loadStates()
{
    const response = await fetch("/static/reference/us_states.json");
    const states = await response.json();

    const dropdowns =
    [
        "registered_state"
    ];

    dropdowns.forEach(id =>
    {
        const select = document.getElementById(id);

        if (!select) { return; }
        select.innerHTML = '<option value="">-- Select State --</option>';
        states.forEach(state =>
        {
            const option = document.createElement("option");
            option.value = state.code;
            option.textContent = state.name;
            select.appendChild(option)
        });
    });
}

function checkActive()
{
    const active =
        document.getElementById(
            "active"
        ).value;

    if (active === "1")
    {
        return;
    }
    
    if (active === "0")
    {
        alert(
            "This onboarding form is temporarily disabled.\n\n" +
            "Please refresh and try again later."
        );
        disableForm();
        return;
    }
    
    const overrideCode =
        prompt(
            "This onboarding form is currently disabled.\n\n" +
            "Please enter the administrator access code."
        );
    
    if (overrideCode !== active)
    {
        alert(
            "Invalid access code."
        );

        disableForm();
        return;
    }
}

function disableForm()
{
    document
        .querySelectorAll(
            'input:not([type="hidden"]), select, textarea'
        )
        .forEach(
            field => field.disabled = true
        );

    document
        .querySelector(
            '.submit-button'
        )
        .disabled = true;

    document
        .querySelector(
            '.submit-button'
        )
        .textContent =
        "Form Disabled";

    document.getElementById("resetButton").style.display = "none";
}
    
function updateSubmitter()
{
    const selected =
        document.querySelector(
            'input[name="x_submitter_type"]:checked'
        ).value;

    const field =
        document.getElementById(
            "submitted_by_name"
        );

    const primary =
        document.querySelector(
            'input[name="x_primary_contact_name"]'
        ).value;

    const secondary =
        document.querySelector(
            'input[name="x_secondary_contact_name"]'
        ).value;

    if (selected === "Primary Contact")
    {
        field.value = primary;
        field.readOnly = true;
    }
    else if (selected === "Secondary Contact")
    {
        if (secondary.trim() === "")
        {
            alert(
                "Please enter a Secondary Contact Name before selecting Secondary Contact as the submitter."
            );
            document.querySelector(
                'input[name="x_submitter_type"][value="Other"]'
                ).checked = true;
            field.value = "";
            field.readOnly = false;
        }
        else
        {
            field.value = secondary;
            field.readOnly = true;
        }   
    }
    else
    {
        field.value = "";
        field.readOnly = false;
    }

    updateSignature();
}

function updateSignature()
{
    const name =
        document.getElementById(
            "submitted_by_name"
        ).value;

    document.getElementById(
        "signature_preview"
    ).textContent = name;
}    
    
function validateEIN(field)
{
    const pattern = /^\d{2}-\d{7}$/;

    if (!pattern.test(field.value))
    {
        field.setCustomValidity(
            "Please enter a valid EIN in the format 12-3456789"
        );
    }
    else
    {
        field.setCustomValidity("");
    }
    field.reportValidity();
}

function formatEIN(field)
{
    let value = field.value.replace(/\D/g, '');

    if (value.length > 9)
    {
        value = value.substring(0, 9);
    }

    if (value.length > 2)
    {
        value =
            value.substring(0, 2) +
            "-" +
            value.substring(2);
    }

    field.value = value;
}

function formatPhone(field)
{
    let value = field.value.replace(/\D/g, '');

    if (value.length > 10)
    {
        value = value.substring(0,10);
    }

    if (value.length > 6)
    {
        value =
            "(" +
            value.substring(0,3) +
            ") " +
            value.substring(3,6) +
            "-" +
            value.substring(6);
    }
    else if (value.length > 3)
    {
        value =
            "(" +
            value.substring(0,3) +
            ") " +
            value.substring(3);
    }

    field.value = value;
}

function validatePhone(field)
{
    // Allow blank values
    if (field.value.trim() === "")
    {
        field.setCustomValidity("");
        return;
    }
    
    const pattern =
        /^\(\d{3}\)\s\d{3}-\d{4}$/;

    if (!pattern.test(field.value))
    {
        field.setCustomValidity(
            "Please enter a phone number in the format (555) 123-4567"
        );
    }
    else
    {
        field.setCustomValidity("");
    }

    field.reportValidity();
}    

function validateEmail(field)
{
    field.value = field.value.trim();

    if (field.value === "")
    {
        field.setCustomValidity("");
        return;
    }
    const pattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!pattern.test(field.value))
    {
        field.setCustomValidity(
            "Please enter a valid email address"
        );
    }
    else
    {
        field.setCustomValidity("");
    }

    field.reportValidity();
}
    
function generateSubmitReference()
{
    const now = new Date();

    const timestamp =
        now.getFullYear().toString() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0") +
        String(now.getSeconds()).padStart(2, "0");

    const random =
        Math.floor(
            100000 + Math.random() * 900000
        );

    return `${timestamp}_${random}`;
}

function resetForm()
{
    if (
        confirm(
            "Are you sure you want to clear the entire form?"
        )
    )
    {
        document
            .querySelector("form")
            .reset();

        document
            .getElementById(
                "submit_reference"
            )
            .value = "0";

        document.getElementById("signature_preview").textContent = "";
        
        updateSubmitter();
    }
}

async function prepareSubmission()
{
    const form =
        document.querySelector("form");

    if (!form.checkValidity())
    {
        form.reportValidity();
        return;
    }

    const submitRefField = document.getElementById("submit_reference");

    if (submitRefField.value !== "0")
    {
        alert(
            "This application has already been submitted.\n\n" +
            "Please use Reset Form before creating a new application."
        );

        return;
    }
   
    const submitReference =
        generateSubmitReference();

    const proceed =
        confirm(
            "APPLICATION READY FOR SUBMISSION\n\n" +
            "Submission Reference:\n\n" +
            submitReference +
            "\n\n" +
            "Please note this reference number.\n\n" +
            "Press OK to submit.\n" +
            "Press Cancel to return to the form."
        );

    if (!proceed)
    {
        return;
    }

    submitRefField.value = submitReference;

    submitApplication();
}

async function submitApplication()
{
    const submittedTimestamp =
    new Date().toLocaleString(
        "en-GB",
        {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
            timeZoneName: "longOffset"
        }
    );   

    const submitTSField = document.getElementById("submitted_timestamp");
    submitTSField.value = submittedTimestamp;
    
    const payload = {};
    document
        .querySelectorAll("[name^='x_']")
        .forEach(field =>
        {
            payload[field.name] = field.value;
        });
       
    payload.submitter_type =
        document.getElementById("submitter_type").value;
    
    console.log(payload);
    
    const response = await fetch(
        "/onboard",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        }
    );

    if (!response.ok)
    {  alert("Submission failed. Please try again." );
        return;
    }

    const result =
        await response.json();
    
    const submissionReference =
        document.getElementById("submit_reference").value;
    
    const companyName =
        document.getElementById("company_name").value;
    
    const submittedBy =
        document.getElementById("submitted_by_name").value;

    const submitterType =
    document.getElementById("submitter_type").value;

    const version =
        document.getElementById("version").textContent;
    
    const receiptUrl =
        "/receipt?" +
        "submission_reference=" +
        encodeURIComponent(
            submissionReference
        ) +

        "&company_name=" +
        encodeURIComponent(
            companyName
        ) +

        "&submitted_by=" +
        encodeURIComponent(
            submittedBy +
            " (" +
            submitterType +
            ")"
        ) +

        "&submitted_timestamp=" +
        encodeURIComponent(
            submittedTimestamp
        ) +
        
        "&version=" +
        encodeURIComponent(
            version
        );

    if (result.status === "ok")
    {
        window.open(
            receiptUrl,
            "_blank" );
    }
    else
    {
        alert("Submission failed.");
    }
}

   
document
