    <div class="four_column-group">
        <label for="business_years">
            Years in Operation
        </label>

        <select
            id="business_years"
            name="x_business_years"
            required>
        </select>
    </div>

    <div class="four_column-group">
        <label for="number_staff">
            Staff
        </label>

        <select
            id="number_staff"
            name="x_staff"
            required>

    <div class="four_column-group">
        <label for="active_patients">
            Active Patients
        </label>

        <select
            id="active_patients"

    <div class="four_column-group">

            Monthly Patient Interactions
        </label>
        
        <select
